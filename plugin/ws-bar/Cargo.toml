[package]
name = "windows-settings-bar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "1-line TrueColor BASE02 shelf top-bar plugin for windows-settings Zellij 0.46+ IDE sessions"

[dependencies]
zellij-tile = "0.46.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
