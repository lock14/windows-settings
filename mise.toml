# =============================================================
# mise.toml - Declarative Polyglot Runtime Toolchains
# Managed via mise (https://mise.jdx.dev)
# =============================================================

[tool_alias]
elan = "github:leanprover/elan"

[tools]
bat = "latest"
delta = "latest"
dust = "latest"
elan = { version = "latest", rename_exe = "elan-init" }
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
java = "lts"
jq = "latest"
maven = "latest"
neovim = "latest"
node = "lts"
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"
# Pin TypeScript to 6.x (TypeScript 6 ships lib/tsserver.js required by ts_ls)
"npm:typescript" = "6"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
python = "latest"
ripgrep = "latest"
rust = "latest"
sd = "latest"
tealdeer = "latest"
terraform = "latest"
tree-sitter = "latest"
yq = "latest"
zellij = "latest"
zoxide = "latest"

[settings]
legacy_version_file = true
experimental = true
http_timeout = "120s"
go.set_gobin = false
go.set_gopath = false
