# Default clangd configuration for windows-settings (%LOCALAPPDATA%\clangd\config.yaml)
# Uses modern GNU dialects for full C23/C++20 language features with WinLibs GCC / MinGW-w64.

If:
  PathMatch: .*\.(cpp|cc|cxx|hpp|hxx)$
CompileFlags:
  Add: [-std=gnu++20]
---
If:
  PathMatch: .*\.c$
CompileFlags:
  Add: [-std=gnu23]
