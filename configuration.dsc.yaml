# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# =============================================================
# Windows Developer Workstation Desired State Configuration (DSC)
# Execute: winget configure .\configuration.dsc.yaml
# =============================================================

properties:
  configurationVersion: 0.2.0
  resources:
    # ---------------------------------------------------------
    # Core CLI Developer Toolchain
    # ---------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Rust GNU coreutils
        allowPrerelease: true
      settings:
        id: uutils.coreutils
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Rust diffutils
        allowPrerelease: true
      settings:
        id: uutils.diffutils
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Git for Windows
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub CLI
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Delta TrueColor Git Pager
      settings:
        id: dandavison.delta
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Oh My Posh Prompt Engine
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Zoxide (Smart directory navigation)
      settings:
        id: ajeetdsouza.zoxide
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Ripgrep
      settings:
        id: BurntSushi.ripgrep.MSVC
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install fd (Fast find)
      settings:
        id: sharkdp.fd
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install fzf (Fuzzy finder)
      settings:
        id: junegunn.fzf
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install jq (JSON processor)
      settings:
        id: jqlang.jq
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install yq (YAML/XML/TOML processor)
      settings:
        id: MikeFarah.yq
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install dust (Disk usage analyzer)
      settings:
        id: bootandy.dust
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install sd (Intuitive find & replace)
      settings:
        id: chmln.sd
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Tealdeer (Fast Rust tldr client)
      settings:
        id: dbrgn.tealdeer
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Zellij (Terminal workspace & agent session multiplexer)
      settings:
        id: Zellij.Zellij
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install btop4win (TrueColor system monitor)
      settings:
        id: aristocratos.btop4win
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Mise (Polyglot runtime manager)
      settings:
        id: jdx.mise
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Vim (Command-line editor)
      settings:
        id: vim.vim
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install WinLibs GCC & MinGW-w64 (C/C++ compiler for Tree-sitter)
      settings:
        id: BrechtSanders.WinLibs.POSIX.UCRT
        source: winget

    # ---------------------------------------------------------
    # Fonts
    # ---------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install MesloLGS Nerd Font
      settings:
        id: DEVCOM.MesloLGSNF
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Cascadia Code Nerd Font
      settings:
        id: Microsoft.CascadiaCode
        source: winget
