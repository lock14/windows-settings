# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# =============================================================
# Windows Developer Workstation Desired State Configuration (DSC)
# Execute: winget configure .\configuration.dsc.yaml
# =============================================================

properties:
  configurationVersion: 0.2.0
  resources:
    # ---------------------------------------------------------
    # Core CLI Developer Toolchain
    # ---------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Rust GNU coreutils
        allowPrerelease: true
      settings:
        id: uutils.coreutils
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Rust diffutils
        allowPrerelease: true
      settings:
        id: uutils.diffutils
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Git for Windows
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub CLI
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Oh My Posh Prompt Engine
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Zoxide (Smart directory navigation)
      settings:
        id: ajeetdsouza.zoxide
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Ripgrep
      settings:
        id: BurntSushi.ripgrep.MSVC
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install fd (Fast find)
      settings:
        id: sharkdp.fd
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install fzf (Fuzzy finder)
      settings:
        id: junegunn.fzf
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install jq (JSON processor)
      settings:
        id: jqlang.jq
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Mise (Polyglot runtime manager)
      settings:
        id: jdx.mise
        source: winget

    # ---------------------------------------------------------
    # Fonts
    # ---------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install MesloLGS Nerd Font
      settings:
        id: DEVCOM.MesloLGSNF
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Cascadia Code Nerd Font
      settings:
        id: Microsoft.CascadiaCode
        source: winget
