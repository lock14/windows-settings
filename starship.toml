# =============================================================
# Starship Prompt - Solarized Dark Powerlevel10k Single Line
# =============================================================

# Disable newline before prompt to match single-line layout
add_newline = false

# Left prompt layout
format = """
[ $os$os_symbol ](fg:#073642 bg:#eee8d5)\
[](fg:#eee8d5 bg:#268bd2)\
[  $directory ](fg:#fdf6e3 bg:#268bd2)\
[](fg:#268bd2 bg:#859900)\
$git_branch\
$git_status\
[ ](fg:#859900)\
$character"""

# Right prompt layout (rprompt)
right_format = """
$nodejs\
$golang\
$python\
$dotnet\
$rust\
$aws\
$cmd_duration\
$status"""

# -------------------------------------------------------------
# Left Prompt Segments
# -------------------------------------------------------------

[os]
disabled = false
style = "fg:#073642 bg:#eee8d5"

[os.symbols]
Windows = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Arch = ""
Linux = ""
Macos = ""

[directory]
style = "fg:#fdf6e3 bg:#268bd2"
format = "[$path]($style)"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
style = "fg:#073642 bg:#859900"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:#073642 bg:#859900"
format = "([$all_status$ahead_behind]($style))"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
staged = " ${count} "
modified = " ${count} "
untracked = " ${count} "
deleted = " ${count} "
stashed = " ${count} "

[character]
success_symbol = ""
error_symbol = ""

# -------------------------------------------------------------
# Right Prompt Segments (rprompt)
# -------------------------------------------------------------

[nodejs]
style = "fg:#073642 bg:#859900"
symbol = ""
format = "[](fg:#859900)[ $version $symbol ]($style)"

[golang]
style = "fg:#073642 bg:#2aa198"
symbol = ""
format = "[](fg:#2aa198)[ $version $symbol ]($style)"

[python]
style = "fg:#073642 bg:#b58900"
symbol = ""
format = "[](fg:#b58900)[ $version $symbol ]($style)"

[dotnet]
style = "fg:#fdf6e3 bg:#6c71c4"
symbol = ""
format = "[](fg:#6c71c4)[ $version $symbol ]($style)"

[rust]
style = "fg:#fdf6e3 bg:#cb4b16"
symbol = ""
format = "[](fg:#cb4b16)[ $version $symbol ]($style)"

[aws]
style = "fg:#fdf6e3 bg:#cb4b16"
symbol = ""
format = "[](fg:#cb4b16)[ $profile($region) $symbol ]($style)"

[cmd_duration]
min_time = 500
style = "fg:#073642 bg:#b58900"
format = "[](fg:#b58900)[ ${duration}  ]($style)"

[status]
disabled = false
style = "fg:#eee8d5 bg:#073642"
format = "[](fg:#073642)[  ]($style)"
error_style = "fg:#eee8d5 bg:#dc322f"
error_format = "[](fg:#dc322f)[ $status  ]($error_style)"
