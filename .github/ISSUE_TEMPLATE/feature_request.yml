name: Feature request
description: Propose a new CLI utility, shell shortcut, IDE workflow, theme, or syntax grammar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - "Zellij and Neovim IDE workspace (bin/ide.ps1, config/zellij/)"
        - "Color theme engine or built-in palette (bin/theme.ps1, config/themes/)"
        - "PowerShell module or cmd.exe shortcut (module/, config/cmd/)"
        - "Standalone CLI utility (bin/)"
        - "Syntax grammar or Tree-sitter query (config/bat/, config/nvim/)"
        - "Setup orchestrator or package manifest (setup.ps1, configuration.dsc.yaml, mise.toml)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Workflow limitation or missing capability this proposal addresses.
      placeholder: Describe the workflow problem or use case...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and CLI design
      description: Describe the proposed commands, flags, aliases, keybindings, or configuration options.
      render: powershell
      placeholder: |
        ide --status
    validations:
      required: true

  - type: textarea
    id: considerations
    attributes:
      label: Cross-tool and performance considerations
      description: Note any impact on shell startup latency, dry-run safety, `cmd.exe` parity, or the 17-theme color contract.
      placeholder: |
        - Dual .ps1 and .cmd wrapper in bin/
        - Supports --dry-run
        - Zero impact on WindowsSettings module import latency
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Alternative approaches or workarounds evaluated.
    validations:
      required: false
