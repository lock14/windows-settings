version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # Rust WASM Top-Bar Plugin
  - package-ecosystem: cargo
    directory: "/plugin/ws-bar"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
