name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-hygiene:
    name: Lint and Repository Hygiene
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Line Endings, AGENTS.md Budget, and Personal-Path Hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crlfExts = @('.ps1', '.psm1', '.psd1', '.cmd', '.bat', '.doskey')
          $lfExts   = @('.md', '.json', '.kdl', '.yml', '.yaml', '.toml', '.lock', '.rs', '.lua', '.scm', '.theme', '.tmTheme', '.sublime-syntax', '.gitconfig', '.conf', '.txt')
          $violations = [System.Collections.Generic.List[string]]::new()

          $agentsBytes = (Get-Item -LiteralPath './AGENTS.md').Length
          if ($agentsBytes -ge 24576) {
              $violations.Add("AGENTS.md exceeds 24 KB context budget ($agentsBytes bytes)")
          }

          foreach ($file in (Get-ChildItem -Path . -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/](\.git|tests[\\/]temp|plugin[\\/]ws-bar[\\/]target)[\\/]' })) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              if ($bytes.Length -eq 0) { continue }
              $text = [System.Text.Encoding]::UTF8.GetString($bytes)

              if ($crlfExts -contains $file.Extension) {
                  if (($text -replace "`r`n", "").Contains("`n")) {
                      $violations.Add("Expected CRLF only: $($file.FullName)")
                  }
              } elseif ($lfExts -contains $file.Extension -or $file.Name -eq 'LICENSE') {
                  if ($text.Contains("`r`n")) {
                      $violations.Add("Expected LF only: $($file.FullName)")
                  }
              }

              if ($text -match 'C:\\Users\\(?!<)[a-zA-Z0-9_-]+' -or $text -match '/Users/(?!<)[a-zA-Z0-9_-]+' -or $text -match '/home/(?!<)[a-zA-Z0-9_-]+') {
                  $violations.Add("Hardcoded personal user path detected: $($file.FullName)")
              }
          }

          if ($violations.Count -gt 0) {
              $violations | ForEach-Object { Write-Host "  [FAIL] $_" -ForegroundColor Red }
              Write-Error "Repository hygiene check failed with $($violations.Count) issue(s)."
              exit 1
          }
          Write-Host "Hygiene: Line endings, AGENTS.md budget, and path invariants verified cleanly." -ForegroundColor Green

      - name: Verify Managed Theme Assets (--check-assets)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./bin/theme.ps1 --check-assets

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts with PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize
              Write-Error "PSScriptAnalyzer found lint issues!"
              exit 1
          }
          Write-Host "PSScriptAnalyzer: No errors or warnings found." -ForegroundColor Green

  test:
    name: Test Windows Settings
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Oh My Posh
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-RestMethod https://ohmyposh.dev/install.ps1 | Invoke-Expression
          $ompDir = "$HOME\AppData\Local\Programs\oh-my-posh\bin"
          $env:Path += ";$ompDir"
          $ompDir | Out-File -FilePath $env:GITHUB_PATH -Append
          oh-my-posh --version

      - name: Install Zellij
        shell: pwsh
        run: |
          $zellijDir = Join-Path $env:RUNNER_TEMP 'zellij-bin'
          New-Item -ItemType Directory -Force -Path $zellijDir | Out-Null
          $zipPath = Join-Path $zellijDir 'zellij.zip'
          Invoke-WebRequest -Uri 'https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-pc-windows-msvc.zip' -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $zellijDir -Force
          Remove-Item -Path $zipPath -Force
          $env:Path = "$zellijDir;$env:Path"
          $zellijDir | Out-File -FilePath $env:GITHUB_PATH -Append
          zellij --version

      - name: Install Neovim and Run Headless Theme Smoke Check
        shell: pwsh
        run: |
          $nvimRoot = Join-Path $env:RUNNER_TEMP 'nvim-bin'
          New-Item -ItemType Directory -Force -Path $nvimRoot | Out-Null
          $nvimZip = Join-Path $nvimRoot 'nvim-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/neovim/neovim/releases/latest/download/nvim-win64.zip' -OutFile $nvimZip
          Expand-Archive -Path $nvimZip -DestinationPath $nvimRoot -Force
          Remove-Item -Path $nvimZip -Force
          $nvimBin = Join-Path (Join-Path $nvimRoot 'nvim-win64') 'bin'
          $env:Path = "$nvimBin;$env:Path"
          $nvimBin | Out-File -FilePath $env:GITHUB_PATH -Append
          nvim --version | Select-Object -First 3
          nvim -i NONE --headless -u ./config/nvim/init.lua '+Theme dracula' '+Theme rose-pine' '+Theme solarized-dark' '+qa'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Test Suite
        shell: pwsh
        run: |
          $null | ./tests/test_settings.ps1

      - name: Measure Module Import Latency and Publish Summary
        shell: pwsh
        run: |
          $coldMs = (Measure-Command {
              & pwsh -NoProfile -Command "Import-Module ./module/WindowsSettings.psd1 -DisableNameChecking"
          }).TotalMilliseconds
          $warmMs = (Measure-Command {
              Import-Module ./module/WindowsSettings.psd1 -DisableNameChecking
              Import-Module ./module/WindowsSettings.psd1 -DisableNameChecking -Force
          }).TotalMilliseconds

          $summary = @(
              '## WindowsSettings CI telemetry'
              ''
              '| Metric | Result |'
              '| :--- | :--- |'
              ('| Subprocess and cold import (`pwsh -NoProfile` and `Import-Module`) | `{0:N1} ms` |' -f $coldMs)
              ('| In-session re-import (`Import-Module -Force` with disk cache) | `{0:N1} ms` |' -f $warmMs)
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  wasm-plugin:
    name: Build and Test WASM Top-Bar Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo registry and WASM build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            plugin/ws-bar/target/
          key: ${{ runner.os }}-cargo-ws-bar-${{ hashFiles('plugin/ws-bar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ws-bar-

      - name: Install wasm32-wasip1 target and clippy
        run: |
          rustup target add wasm32-wasip1
          rustup component add clippy

      - name: Run Rust unit tests, Clippy, and WASM release build
        run: |
          cargo test --manifest-path plugin/ws-bar/Cargo.toml --target x86_64-unknown-linux-gnu --locked
          cargo clippy --manifest-path plugin/ws-bar/Cargo.toml --target wasm32-wasip1 --locked -- -D warnings
          cargo build --release --manifest-path plugin/ws-bar/Cargo.toml --target wasm32-wasip1 --locked
          ls -lh plugin/ws-bar/target/wasm32-wasip1/release/windows-settings-bar.wasm

  ci-gatekeeper:
    name: ci-gatekeeper
    runs-on: ubuntu-latest
    needs:
      - lint-and-hygiene
      - test
      - wasm-plugin
    if: always()
    env:
      LINT_RESULT: ${{ needs.lint-and-hygiene.result }}
      TEST_RESULT: ${{ needs.test.result }}
      WASM_RESULT: ${{ needs.wasm-plugin.result }}
    steps:
      - name: Evaluate Gatekeeper Status
        run: |
          echo "Evaluating CI pipeline job results:"
          echo "Lint and Hygiene: ${LINT_RESULT}"
          echo "Test Suite:       ${TEST_RESULT}"
          echo "WASM Plugin:      ${WASM_RESULT}"

          if [ "${LINT_RESULT}" != "success" ] || [ "${TEST_RESULT}" != "success" ] || [ "${WASM_RESULT}" != "success" ]; then
            echo "[FAIL] CI Gatekeeper failed: one or more upstream checks did not succeed."
            exit 1
          fi

          echo "[PASS] All required CI checks passed."
